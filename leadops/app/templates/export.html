{% extends "base.html" %}
{% block content %}
<h1>Export leads</h1>

<form action="/export-form" method="post">
    <table>
        <thead>
            <tr>
                <th>Select</th>
                <th>Owner</th>
                <th>Address</th>
                <th>Trigger</th>
                <th>Score</th>
                <th>Tier</th>
                <th>Opener</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                <td><input type="checkbox" name="lead_ids" value="{{ row.lead_id }}" /></td>
                <td>{{ row.owner_name }}</td>
                <td>{{ row.address_normalized }}</td>
                <td>{{ row.trigger_type }}</td>
                <td>{{ row.score }}</td>
                <td>{{ row.tier }}</td>
                <td>{{ row.suggested_opener }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button type="submit">Export selected CSV</button>
</form>
{% endblock %}
