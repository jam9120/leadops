{% extends "base.html" %}
{% block content %}

<h1>Lead review</h1>

<form method="get" action="/leads" class="filter-form">
<label>
Tier
<select name="tier">
<option value="">All</option>
<option value="Tier 1" {% if selected_tier == "Tier 1" %}selected{% endif %}>Tier 1</option>
<option value="Tier 2" {% if selected_tier == "Tier 2" %}selected{% endif %}>Tier 2</option>
<option value="Tier 3" {% if selected_tier == "Tier 3" %}selected{% endif %}>Tier 3</option>
</select>
</label>

<label>
Trigger
<select name="trigger_type">
<option value="">All</option>
{% for t in trigger_types %}
<option value="{{ t }}" {% if selected_trigger_type == t %}selected{% endif %}>{{ t }}</option>
{% endfor %}
</select>
</label>

<button type="submit">Filter</button>

</form>

<table>
<thead>
<tr>
<th>Owner</th>
<th>Address</th>
<th>Trigger</th>
<th>Score</th>
<th>Tier</th>
<th>Opener</th>
</tr>
</thead>
<tbody>
{% for row in rows %}
<tr>
<td>{{ row.owner_name }}</td>
<td>{{ row.address_normalized }}</td>
<td>{{ row.trigger_type }}</td>
<td>{{ row.score }}</td>
<td>{{ row.tier }}</td>
<td>{{ row.suggested_opener }}</td>
</tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
